<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Djignan — tests des fonctions de saisie rapide, carnet et tontines</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
  #summary { font-weight: 700; margin: 12px 0; padding: 10px 14px; border-radius: 8px; }
  #summary.pass { background: rgba(22,163,74,.15); } #summary.fail { background: rgba(225,29,72,.15); }
  li { list-style: none; padding: 3px 8px; font-size: 13px; } li.pass { color: #16a34a; } li.fail { background: rgba(225,29,72,.12); color: #e11d48; }
  .detail { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h1>Djignan — tests : SMS Mobile Money, dictée, fiche personne, tontines, étiquettes</h1>
<p class="detail">Les SMS ci-dessous sont des exemples <strong>inventés</strong> (aucun corpus officiel d'opérateur n'a servi) : ils vérifient la logique d'analyse, pas la couverture de chaque opérateur. Base IndexedDB isolée.</p>
<div id="summary">Exécution…</div>
<ul id="results"></ul>

<script type="module">
window.__GEOFINANCE_TEST_DB_NAME__ = 'geofinance-features-test-db';

const { STORES, dbAdd, dbGetAll, wipeAllData, setSetting } = await import('../js/db.js');
const { parseMobileMoneyMessage: sms, parseMobileMoneyMessages, parseAmountToken, currencyMatchesWallet } = await import('../js/mobile-money-parser.js');
const { parseSpokenEntry: say } = await import('../js/voice-input.js');
const { buildPersonStatement, buildReminderMessage, whatsappUrl, smsUrl, normalizeName, summarizePeople } = await import('../js/modules/person-ledger.js');
const { roundDate, currentRoundIndex, beneficiaryOf, potAmount, parseMembersText } = await import('../js/modules/tontines.js');
const { computeNetWorth, computeMonthSummary, computeTagSummary, computeNetWorthComposition, isInvestmentMovementExcluded } = await import('../js/ledger.js');
const { computeMobileMoneyFees, isMobileMoneyFee } = await import('../js/ledger.js');
const { annuityPayment, buildSchedule, scheduleStatus, accruedInterest, addMonthsISO } = await import('../js/loan-schedule.js');
const { numberToWordsFr, numberToWordsEn, amountInWords } = await import('../js/debt-acknowledgement.js');
const { monthlyContribution, nextEventMonthKey, monthsInclusive, provisionStatus } = await import('../js/modules/provisions.js');
const { buildAnnualRecap, annualHighlights } = await import('../js/annual-recap.js');

const results = [];
const eq = (desc, actual, expected) => results.push({ desc, ok: JSON.stringify(actual) === JSON.stringify(expected), actual, expected });
const near = (desc, actual, expected) => results.push({ desc, ok: Math.abs(actual - expected) < 0.005, actual, expected });
const ok = (desc, cond, detail = '') => results.push({ desc, ok: !!cond, actual: detail, expected: true });

const today = new Date(2026, 9, 18);

// ---------- Montants ----------
eq('montant « 5 000 »', parseAmountToken('5 000'), 5000);
eq('montant « 5.000 » (milliers)', parseAmountToken('5.000'), 5000);
eq('montant « 5,000.50 »', parseAmountToken('5,000.50'), 5000.5);
eq('montant « 1 234,5 »', parseAmountToken('1 234,5'), 1234.5);
eq('montant « 1,234,567 » (milliers répétés)', parseAmountToken('1,234,567'), 1234567);
eq('montant ambigu « 1.2.3 » refusé', parseAmountToken('1.2.3'), null);

// ---------- SMS ----------
const a = sms('Vous avez envoyé 5 000F à Moussa Diop (+221771234567). Frais: 100F. Nouveau solde: 12 400F. ID: TX8841923', { today });
eq('envoi : sens/montant/frais/solde', [a.direction, a.amount, a.fee, a.balance], ['out', 5000, 100, 12400]);
eq('envoi : contrepartie, téléphone, référence', [a.counterparty, a.phone, a.reference], ['Moussa Diop', '+221771234567', 'TX8841923']);
const b = sms('Vous avez reçu 10 000 FCFA de Awa Ndiaye. Nouveau solde: 30 000 FCFA. Ref: 8839201', { today });
eq('réception : sens + contrepartie', [b.direction, b.amount, b.counterparty], ['in', 10000, 'Awa Ndiaye']);
const c = sms('Retrait de 20000 FCFA effectué chez l\'agent KONE. Frais: 400 FCFA. Solde: 5 000 FCFA', { today });
eq('retrait : nature + frais', [c.kind, c.fee, c.direction], ['withdrawal', 400, 'out']);
const d = sms('Dépôt de 50 000 FCFA réussi. Nouveau solde: 55 000 FCFA. 15/10/2026', { today });
eq('dépôt : nature + date JJ/MM/AAAA', [d.kind, d.direction, d.date], ['deposit', 'in', '2026-10-15']);
const e = sms('Recharge de 1000F effectuée. Votre nouveau solde est de 4 000F', { today });
eq('recharge : « recharge » n\'est pas lu comme « frais »', [e.kind, e.amount, e.fee, e.balance], ['airtime', 1000, 0, 4000]);
const f = sms('You have received GHS 150.00 from KWAME ASANTE. Your new balance is GHS 1,250.50. Financial Transaction Id: 3827182', { today });
eq('anglais : montant GHS, solde, référence', [f.direction, f.amount, f.currency, f.balance, f.reference], ['in', 150, 'GHS', 1250.5, '3827182']);
eq('SMS sans montant (code OTP) ignoré', sms('Votre code OTP est 482913', { today }), null);
eq('« Solde actuel » seul n\'est pas une opération', sms('Solde actuel: 5000F', { today }), null);
eq('date invalide 31/02 ignorée', sms('Vous avez payé 1000 F à X. Le 31/02/2026', { today }).date, null);
const many = parseMobileMoneyMessages('Vous avez envoyé 5 000F à Moussa. ID: AB12345\n\nbla bla\n\nVous avez reçu 2 000 F de Awa. ID: CD67890', { today });
eq('plusieurs SMS collés : 2 reconnus, 1 ignoré', [many.messages.length, many.unrecognized], [2, 1]);
ok('« F CFA » convient à XOF et XAF', currencyMatchesWallet('CFA', 'XOF') && currencyMatchesWallet('CFA', 'XAF') && !currencyMatchesWallet('CFA', 'EUR'));

// ---------- Dictée ----------
eq('dictée : « 2500 taxi »', say('2500 taxi'), { type: 'expense', amount: 2500, note: 'Taxi' });
eq('dictée : chiffres groupés « 2 500 »', say('taxi 2 500').amount, 2500);
eq('dictée : nombre en lettres + remplissage', say("j'ai dépensé deux mille cinq cents francs pour le taxi"), { type: 'expense', amount: 2500, note: 'Taxi' });
eq('dictée : quatre-vingt-dix mille', say('quatre-vingt-dix mille loyer').amount, 90000);
eq('dictée : soixante-dix mille', say('soixante-dix mille transport').amount, 70000);
eq('dictée : recette « reçu salaire »', [say('reçu salaire 150 000').type, say('reçu salaire 150 000').amount], ['income', 150000]);
eq('dictée : sans nombre → montant null', say('bonjour').amount, null);
eq('dictée anglaise', say('I spent two thousand five hundred on lunch', 'en'), { type: 'expense', amount: 2500, note: 'Lunch' });

// ---------- Fiche par personne ----------
const debts = [
  { id: 'd1', type: 'receivable', personName: 'Moussa Diop', principal: 15000, currency: 'XOF', startDate: '2026-09-01', dueDate: '2026-11-01', status: 'active', note: 'Tissu' },
  { id: 'd2', type: 'debt', personName: 'moussa  diop', principal: 2000, currency: 'XOF', startDate: '2026-10-10', status: 'active' },
  { id: 'd3', type: 'receivable', personName: 'Awa', principal: 3000, currency: 'XOF', startDate: '2026-10-01', status: 'paid' },
];
const payments = [{ id: 'p1', debtId: 'd1', amount: 5000, date: '2026-10-05' }, { id: 'p2', debtId: 'd3', amount: 3000, date: '2026-10-06' }];
eq('noms normalisés', normalizeName('  Moussá   DIOP '), 'moussa diop');
const st = buildPersonStatement('Moussa Diop', debts, payments);
eq('relevé : deux dettes regroupées, solde net 8000', [st.debts.length, st.balances.XOF], [2, 8000]);
eq('relevé : ordre chronologique et solde cumulé', st.events.map((x) => x.balanceAfter), [15000, 10000, 8000]);
eq('relevé : prochaine échéance', st.nextDueDate, '2026-11-01');
eq('« par personne » masque une personne soldée', summarizePeople(debts, payments).map((p) => p.name), ['Moussa Diop']);
const msg = buildReminderMessage({ name: 'Moussa', amounts: [{ currency: 'XOF', value: 8000 }], dueDate: '2026-11-01', senderName: 'Bibiê' }, (s, v = {}) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]), (n, c) => `${n} ${c}`, (x) => x);
ok('relance : montant, échéance et signature', msg.includes('8000 XOF') && msg.includes('2026-11-01') && msg.endsWith('— Bibiê'), msg);
eq('WhatsApp : numéro nettoyé', whatsappUrl('+225 07 00 11 22 33', 'Salut').startsWith('https://wa.me/2250700112233?text='), true);
eq('WhatsApp : « 00 » international', whatsappUrl('00225 0700112233', 'x').startsWith('https://wa.me/2250700112233'), true);
eq('WhatsApp : sans numéro → choix du contact', whatsappUrl('', 'x').startsWith('https://wa.me/?text='), true);
eq('SMS Android : numéro + message', smsUrl('+225 07 00 11 22 33', 'Salut à toi', false), 'sms:+2250700112233?body=Salut%20%C3%A0%20toi');
eq('SMS iOS : « & » avant body', smsUrl('+225 07 00 11 22 33', 'x', true), 'sms:+2250700112233&body=x');
eq('SMS « 00 » international → +', smsUrl('00225 0700112233', 'x', false), 'sms:+2250700112233?body=x');
eq('SMS sans numéro → app SMS ouverte sans destinataire', smsUrl('', 'x', false), 'sms:?body=x');

// ---------- Tontines : calendrier ----------
const tontine = { startDate: '2026-01-31', frequency: 'monthly', amount: 10000, members: [{ id: 'a' }, { id: 'me' }, { id: 'c' }, { id: 'd' }], order: ['a', 'me', 'c', 'd'] };
eq('mensuel : 31 janvier → 28 février (pas de saut de mois)', [roundDate(tontine, 0), roundDate(tontine, 1), roundDate(tontine, 2)], ['2026-01-31', '2026-02-28', '2026-03-31']);
eq('hebdomadaire +7 jours', roundDate({ startDate: '2026-10-01', frequency: 'weekly' }, 2), '2026-10-15');
eq('toutes les 2 semaines', roundDate({ startDate: '2026-10-01', frequency: 'biweekly' }, 1), '2026-10-15');
eq('tour en cours (3e tour passé)', currentRoundIndex(tontine, '2026-03-31'), 2);
eq('avant le départ : tour 0', currentRoundIndex(tontine, '2025-12-01'), 0);
eq('après la fin : dernier tour', currentRoundIndex(tontine, '2030-01-01'), 3);
eq('bénéficiaire du tour 2', beneficiaryOf(tontine, 1).id, 'me');
eq('pot = montant × membres', potAmount(tontine), 40000);
eq('membres : doublons et lignes vides ignorés', parseMembersText('Awa ; +225 1\n\n awa \nMoussa').map((m) => m.name), ['Awa', 'Moussa']);

// ---------- Effets sur les comptes (base isolée) ----------
await wipeAllData();
await setSetting('baseCurrency', 'XOF');
await dbAdd(STORES.EXCHANGE_RATES, { code: 'XOF', rateToBase: 1, confirmed: true });
await dbAdd(STORES.WALLETS, { id: 'w1', name: 'Banque', currency: 'XOF', initialBalance: 100000, createdAt: '2026-01-01T00:00:00.000Z' });
const month = '2026-10';
await dbAdd(STORES.TRANSACTIONS, { id: 't1', type: 'income', walletId: 'w1', amount: 50000, date: '2026-10-02', tags: ['pro'] });
await dbAdd(STORES.TRANSACTIONS, { id: 't2', type: 'expense', walletId: 'w1', amount: 12000, date: '2026-10-03', tags: ['pro', 'sms'] });
await dbAdd(STORES.TRANSACTIONS, { id: 't3', type: 'expense', walletId: 'w1', amount: 3000, date: '2026-10-04', tags: ['perso'] });
const nwBefore = (await computeNetWorth()).total;
const sumBefore = await computeMonthSummary(month);
await dbAdd(STORES.TRANSACTIONS, { id: 't4', type: 'expense', walletId: 'w1', amount: 10000, date: '2026-10-05', tontineId: 'x', tontineMovement: 'contribution' });
const nwAfterContribution = (await computeNetWorth()).total;
const sumAfter = await computeMonthSummary(month);
near('tontine : une cotisation ne change pas le patrimoine net', nwAfterContribution, nwBefore);
near('tontine : une cotisation n\'est pas une dépense', sumAfter.expenses, sumBefore.expenses);
ok('tontine : transaction exclue des agrégats', isInvestmentMovementExcluded({ tontineId: 'x', type: 'expense' }));
await dbAdd(STORES.TRANSACTIONS, { id: 't5', type: 'income', walletId: 'w1', amount: 40000, date: '2026-10-06', tontineId: 'x', tontineMovement: 'pot' });
near('tontine : recevoir le pot ne change pas le patrimoine net', (await computeNetWorth()).total, nwBefore);
near('tontine : le pot n\'est pas un revenu', (await computeMonthSummary(month)).income, sumBefore.income);
near('tontine : position nette (versé − reçu) sur la ligne épargne', (await computeNetWorthComposition()).savings, -30000);

const tags = await computeTagSummary(month);
const pro = tags.rows.find((r) => r.tag === 'pro');
eq('étiquette « pro » : entrées / sorties / résultat', [pro.income, pro.expenses, pro.result], [50000, 12000, 38000]);
ok('étiquette technique « sms » absente du bilan', !tags.rows.some((r) => r.tag === 'sms'));
ok('transactions de tontine absentes du bilan par étiquette', !tags.rows.some((r) => r.tag === undefined));

// ---------- Sauvegarde cloud automatique (logique locale, aucun réseau) ----------
const { exportAllData, getSetting, importAllData } = await import('../js/db.js');
const cloud = await import('../js/firebase-sync.js');
const { notifyDataChanged } = await import('../js/state.js');
cloud.initCloudAutoBackup();
notifyDataChanged('transactions');
await new Promise((r) => setTimeout(r, 150));
eq('auto-backup désactivée : un changement ne marque rien à envoyer', await getSetting('cloudAutoBackupDirty', false), false);
await cloud.enableCloudAutoBackup('mot-de-passe-test');
notifyDataChanged('transactions');
await new Promise((r) => setTimeout(r, 150));
eq('auto-backup activée : un changement marque « à envoyer »', await getSetting('cloudAutoBackupDirty', false), true);
const exported = await exportAllData();
const exportedKeys = exported.stores[STORES.SETTINGS].map((r) => r.key);
ok('le mot de passe de la sauvegarde auto n\'est JAMAIS exporté', !exportedKeys.includes('cloudAutoBackupPassphrase') && !JSON.stringify(exported).includes('mot-de-passe-test'));
ok('l\'état de la sauvegarde auto n\'est pas exporté non plus', !exportedKeys.includes('cloudAutoBackupEnabled') && !exportedKeys.includes('cloudAutoBackupDirty'));
await importAllData({ stores: { [STORES.SETTINGS]: [{ key: 'cloudAutoBackupPassphrase', value: 'evil' }, { key: 'cloudAutoBackupEnabled', value: true }] } }, { merge: true });
eq('un fichier forgé ne peut pas imposer le mot de passe', await getSetting('cloudAutoBackupPassphrase'), 'mot-de-passe-test');
// Restauration en remplacement sur le MÊME appareil : ses réglages propres (PIN, mot de passe de la
// sauvegarde auto) ne doivent pas être effacés (régression trouvée par l'audit de vérification).
await setSetting('pinHash', 'device-pin-hash');
await importAllData(JSON.parse(JSON.stringify(await exportAllData())), { merge: false });
eq('restauration « remplacer tout » : le PIN de l\'appareil est conservé', await getSetting('pinHash'), 'device-pin-hash');
eq('restauration « remplacer tout » : le mot de passe de la sauvegarde auto aussi', await getSetting('cloudAutoBackupPassphrase'), 'mot-de-passe-test');
eq('restauration « remplacer tout » : les réglages de la sauvegarde viennent bien du fichier', await getSetting('baseCurrency'), 'XOF');
const alertWhenOk = await cloud.getCloudAutoBackupAlert();
eq('aucune alerte tant que tout va bien', alertWhenOk, null);
await setSetting('cloudAutoBackupFailures', 3);
await setSetting('cloudAutoBackupLastError', 'réseau coupé');
ok('3 échecs de suite : alerte visible avec la cause', (await cloud.getCloudAutoBackupAlert() || '').includes('réseau coupé'));
await cloud.disableCloudAutoBackup();
eq('désactivation : le mot de passe est effacé de l\'appareil', await getSetting('cloudAutoBackupPassphrase'), null);
eq('désactivation : plus d\'alerte', await cloud.getCloudAutoBackupAlert(), null);
eq('désactivée : runAutoBackup ne fait rien', await cloud.runAutoBackup({ force: true }), 'disabled');

// ---------- Rappels planifiés Android (plugin simulé) ----------
const rem = await import('../js/native-reminders.js');
const nowRef = new Date(2026, 9, 18, 8, 0, 0);
const planInput = {
  now: nowRef,
  wallets: [{ id: 'w1', currency: 'XOF' }],
  recurring: [
    { id: 'r1', active: true, name: 'Loyer', type: 'expense', amount: 80000, walletId: 'w1', nextDate: '2026-10-20' },
    { id: 'r2', active: false, name: 'Inactif', type: 'expense', amount: 1, walletId: 'w1', nextDate: '2026-10-21' },
    { id: 'r3', active: true, name: 'DCA', type: 'expense', amount: 1, walletId: 'w1', nextDate: '2026-10-22', investmentId: 'i1' },
    { id: 'r4', active: true, name: 'Trop loin', type: 'expense', amount: 1, walletId: 'w1', nextDate: '2027-03-01' },
  ],
  debts: [
    { id: 'd1', type: 'receivable', personName: 'Moussa', principal: 15000, currency: 'XOF', dueDate: '2026-10-19', status: 'active' },
    { id: 'd2', type: 'debt', personName: 'Soldée', principal: 100, currency: 'XOF', dueDate: '2026-10-19', status: 'paid' },
    { id: 'd3', type: 'debt', personName: 'Remboursée', principal: 100, currency: 'XOF', dueDate: '2026-10-19', status: 'active' },
  ],
  payments: [{ id: 'p1', debtId: 'd3', amount: 100, date: '2026-10-10' }],
  tontines: [{ id: 'tn1', name: 'Quartier', currency: 'XOF', amount: 10000, frequency: 'monthly', startDate: '2026-10-25', members: [{ id: 'a' }, { id: 'me', isMe: true }], order: ['a', 'me'], payments: [] }],
};
const plan = rem.buildReminderPlan(planInput);
eq('rappels : récurrence, dette impayée et tontine seulement', [...new Set(plan.map((p) => p.key.split(':')[0].replace(/-.*$/, '')))].sort(), ['debt', 'rec', 'tontine']);
eq('rappels : la veille ET le jour même (loyer du 20)', plan.filter((p) => p.key.startsWith('rec-r1')).map((p) => p.at.toISOString().slice(0, 10) + ' ' + p.at.getHours() + 'h').length, 2);
ok('rappels : jamais dans le passé', plan.every((p) => p.at > nowRef));
ok('rappels : dette soldée / totalement remboursée ignorées, récurrence inactive, d\'investissement et lointaine aussi', !plan.some((p) => /d2|d3|r2|r3|r4/.test(p.key)));
eq('rappels : 1re cotisation de tontine le 25 → rappel le 24 à 9 h', plan.find((p) => p.key.startsWith('tontine')).at.getDate(), 24);
eq('identifiant stable et entier', [rem.reminderId('a:1') === rem.reminderId('a:1'), Number.isInteger(rem.reminderId('a:1')), rem.reminderId('a:1') !== rem.reminderId('a:0')], [true, true, true]);
eq('hors APK : non supporté', rem.isNativeReminderSupported(), false);

// Plugin Capacitor simulé : vérifie l'annulation des anciens rappels puis la reprogrammation
const calls = [];
window.Capacitor = { isNativePlatform: () => true, Plugins: { LocalNotifications: {
  checkPermissions: async () => ({ display: 'granted' }),
  requestPermissions: async () => ({ display: 'granted' }),
  cancel: async (arg) => { calls.push(['cancel', arg.notifications.length]); },
  schedule: async (arg) => { calls.push(['schedule', arg.notifications.length]); },
} } };
await wipeAllData();
await dbAdd(STORES.WALLETS, { id: 'w1', name: 'B', currency: 'XOF', initialBalance: 0, createdAt: '2026-01-01T00:00:00.000Z' });
const inTwoDays = new Date(); inTwoDays.setDate(inTwoDays.getDate() + 2);
const dueIso = `${inTwoDays.getFullYear()}-${String(inTwoDays.getMonth() + 1).padStart(2, '0')}-${String(inTwoDays.getDate()).padStart(2, '0')}`;
await dbAdd(STORES.DEBTS, { id: 'dd', type: 'receivable', personName: 'Awa', principal: 5000, currency: 'XOF', startDate: '2026-10-01', dueDate: dueIso, status: 'active' });
eq('rappels désactivés par défaut : rien n\'est programmé', await rem.syncNativeReminders(), 0);
const scheduled = await rem.enableNativeReminders();
ok('activation : au moins la veille/le jour de l\'échéance programmés', scheduled >= 1, scheduled);
await rem.syncNativeReminders();
ok('resynchronisation : les anciens rappels sont annulés avant de reprogrammer', calls.some((c) => c[0] === 'cancel') && calls.filter((c) => c[0] === 'schedule').length >= 2, JSON.stringify(calls));
await rem.disableNativeReminders();
const afterDisable = calls.filter((c) => c[0] === 'cancel').length;
eq('désactivation : plus rien de programmé', await rem.syncNativeReminders(), 0);
ok('désactivation : annulation effectuée', afterDisable >= 2, afterDisable);
delete window.Capacitor;

// ---------- Prévision de trésorerie 30/60 jours ----------
const { buildCashflowForecast } = await import('../js/forecast.js');
const fcBase = {
  today: '2026-10-18', baseCurrency: 'XOF', rates: [],
  wallets: [
    { id: 'w1', name: 'Banque', currency: 'XOF', initialBalance: 100000, createdAt: '2026-01-01T00:00:00.000Z' },
    { id: 'ws', name: 'Épargne', currency: 'XOF', initialBalance: 500000, usage: 'savings', createdAt: '2026-01-01T00:00:00.000Z' },
  ],
  transactions: [],
  recurring: [{ id: 'r1', active: true, name: 'Loyer', type: 'expense', amount: 60000, walletId: 'w1', nextDate: '2026-10-31', frequency: 'monthly', anchorDay: 31 }],
  debts: [
    { id: 'd1', type: 'debt', personName: 'Banque X', principal: 30000, currency: 'XOF', dueDate: '2026-11-05', status: 'active' },
    { id: 'd2', type: 'receivable', personName: 'Moussa', principal: 20000, currency: 'XOF', dueDate: '2026-10-25', status: 'active' },
  ],
  payments: [], tontines: [],
};
const fc = buildCashflowForecast({ ...fcBase, days: 60 });
eq('prévision : solde de départ = portefeuilles courants seulement (pas l\'épargne)', fc.startBalance, 100000);
eq('prévision : le loyer mensuel apparaît 2 fois sur 60 jours (31 oct, 30 nov)', fc.events.filter((e) => e.kind === 'recurring').map((e) => e.date), ['2026-10-31', '2026-11-30']);
near('prévision : solde certain en fin de fenêtre = 100 000 − 2 loyers − dette', fc.endBalance, 100000 - 120000 - 30000);
near('prévision : la créance à encaisser n\'entre que dans la courbe optimiste', fc.endOptimistic - fc.endBalance, 20000);
eq('prévision : solde encore positif le 5 nov. (10 000), premier jour négatif = 30 nov. (2e loyer)', fc.firstNegativeDate, '2026-11-30');
near('prévision : point bas', fc.minBalance, -50000);
const fc30 = buildCashflowForecast({ ...fcBase, days: 30 });
eq('prévision 30 j : une seule occurrence du loyer', fc30.events.filter((e) => e.kind === 'recurring').length, 1);
ok('prévision : la créance est marquée incertaine', fc.events.find((e) => e.kind === 'receivable').certain === false);
const fcLate = buildCashflowForecast({ ...fcBase, days: 30, recurring: [{ id: 'r9', active: true, name: 'En retard', type: 'expense', amount: 1000, walletId: 'w1', nextDate: '2026-10-01', frequency: 'monthly', anchorDay: 1 }] });
eq('prévision : une échéance en retard pèse dès aujourd\'hui', fcLate.events[0].date, '2026-10-18');

// ---------- Lot 2 : sauvegarde vérifiée (empreinte, relecture, vérification à blanc) ----------
{
  const integ = await import('../js/backup-integrity.js');
  const { verifyBackup, getLastBackupVerification, maybeRunMonthlyBackupCheck, getBackupVerificationAlert } = await import('../js/backup-verify.js');
  const { buildEncryptedPayload, decryptPayload, importJsonBackup, BackupIntegrityError } = await import('../js/backup.js');
  const { dbDelete, dbGetAll: getAll, exportAllData } = await import('../js/db.js');

  eq('SHA-256 de « abc » (vecteur de référence)', await integ.sha256Hex('abc'), 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
  const sample = { exportedAt: 'x', version: 5, stores: { transactions: [{ id: 't1', amount: 12.5 }, { id: 't2', amount: 7.5 }], wallets: [{ id: 'w1' }] } };
  sample.integrity = await integ.computeIntegrity(sample.stores);
  eq('empreinte : fichier intact', await integ.checkIntegrity(sample), 'ok');
  eq('empreinte : indépendante de la mise en forme du fichier (espaces, retours)', await integ.checkIntegrity(JSON.parse(JSON.stringify(sample, null, 2))), 'ok');
  const tampered = JSON.parse(JSON.stringify(sample));
  tampered.stores.transactions[0].amount = 1250;
  eq('empreinte : un montant modifié à la main est repéré', await integ.checkIntegrity(tampered), 'mismatch');
  const truncated = JSON.parse(JSON.stringify(sample));
  truncated.stores.transactions.pop();
  eq('empreinte : une ligne en moins est repérée', await integ.checkIntegrity(truncated), 'mismatch');
  eq('empreinte : ancienne sauvegarde sans empreinte → « missing », jamais bloquée', [await integ.checkIntegrity({ stores: {} }), await integ.checkIntegrity(null), await integ.checkIntegrity({ stores: {}, integrity: { algo: 'SHA-3', checksum: 'x' } })], ['missing', 'missing', 'missing']);
  const fp = integ.fingerprintStores(sample.stores);
  eq('signature : lignes par table et total des transactions en centimes', fp, { transactions: { rows: 2, amountCents: 2000 }, wallets: { rows: 1 } });
  eq('signature : réglages ignorés', Object.keys(integ.fingerprintStores({ settings: [{}], wallets: [{}] }, { skip: ['settings'] })), ['wallets']);
  eq('signature : aucune différence entre deux signatures identiques', integ.diffFingerprints(fp, fp), []);
  eq('signature : une table qui perd une ligne et un total qui bouge sont signalés', integ.diffFingerprints(fp, { transactions: { rows: 2, amountCents: 1999 }, wallets: { rows: 0 } }, { wallets: 'Portefeuilles' }), ['transactions : 20.00 → 19.99', 'Portefeuilles : 1 → 0']);

  await wipeAllData();
  await dbAdd(STORES.WALLETS, { id: 'w-v1', name: 'Caisse', currency: 'XOF', initialBalance: 5000, createdAt: '2026-01-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-v1', walletId: 'w-v1', type: 'expense', amount: 1200.5, date: '2026-10-01', categoryId: null, note: 'pain', createdAt: '2026-10-01T10:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-v2', walletId: 'w-v1', type: 'income', amount: 3000, date: '2026-10-02', categoryId: null, note: '', createdAt: '2026-10-02T10:00:00.000Z' });
  const good = await verifyBackup({ now: 1700000000000 });
  ok('vérification : base saine → aucun écart, restauration acceptée', good.ok && good.issues.length === 0 && good.rows >= 3, JSON.stringify(good));
  eq('vérification : résultat mémorisé (propre à l\'appareil)', (await getLastBackupVerification()).at, 1700000000000);
  eq('vérification : pas d\'alerte tableau de bord quand tout va bien', await getBackupVerificationAlert(), null);
  eq('vérification mensuelle : rien à faire moins de 30 jours après', await maybeRunMonthlyBackupCheck(1700000000000 + 10 * 864e5), null);
  ok('vérification mensuelle : relancée après 30 jours', (await maybeRunMonthlyBackupCheck(1700000000000 + 31 * 864e5))?.ok === true);
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-bad', walletId: 'w-v1', type: 'expense', amount: 'douze', date: '2026-10-03' }); // montant non numérique : l'import le refuserait
  const bad = await verifyBackup();
  ok('vérification : une ligne que l\'import refuserait est détectée', !bad.ok && bad.issues.some((i) => i.includes('restauration serait refusée')), JSON.stringify(bad.issues));
  ok('vérification : le problème reste signalé sur le tableau de bord', (await getBackupVerificationAlert())?.includes('problème'));
  const failedAt = (await getLastBackupVerification()).at;
  ok('vérification mensuelle : un échec n\'est pas revérifié avant le lendemain, puis l\'est (pas après 30 jours)',
    (await maybeRunMonthlyBackupCheck(failedAt + 2 * 3600e3)) === null && (await maybeRunMonthlyBackupCheck(failedAt + 26 * 3600e3)) !== null);
  await dbDelete(STORES.TRANSACTIONS, 'tx-bad');
  ok('vérification : relancée après correction → de nouveau saine, alerte disparue', (await verifyBackup()).ok && (await getBackupVerificationAlert()) === null);
  ok('réglages propres à l\'appareil absents de l\'export (backupVerification, smsInbox…)', !(await exportAllData()).stores[STORES.SETTINGS].some((r) => ['backupVerification', 'smsInbox', 'pinFailureLog', 'lastUnlockAt', 'helperPinHash'].includes(r.key)));

  const payload = await buildEncryptedPayload('mot-de-passe-test');
  const reopened = await decryptPayload(payload, 'mot-de-passe-test');
  eq('export chiffré : relu avec le bon mot de passe, empreinte correcte', await integ.checkIntegrity(reopened), 'ok');
  let wrongPassword = null;
  try { await decryptPayload(payload, 'autre'); } catch (e) { wrongPassword = e.message; }
  ok('export chiffré : mauvais mot de passe refusé', !!wrongPassword);

  const fileOf = (obj) => new File([JSON.stringify(obj)], 'b.json', { type: 'application/json' });
  const full = await exportAllData();
  full.integrity = await integ.computeIntegrity(full.stores);
  const forged = JSON.parse(JSON.stringify(full));
  forged.stores[STORES.TRANSACTIONS][0].amount += 1;
  let integrityError = null;
  try { await importJsonBackup(fileOf(forged), { merge: true }); } catch (e) { integrityError = e; }
  ok('import : un fichier modifié est refusé avec BackupIntegrityError', integrityError instanceof BackupIntegrityError, integrityError && integrityError.name);
  const amountsAfterRefusal = (await getAll(STORES.TRANSACTIONS)).map((x) => x.amount).sort();
  eq('import : rien n\'a été écrit après le refus', amountsAfterRefusal, [1200.5, 3000]);
  await importJsonBackup(fileOf(forged), { merge: true, ignoreIntegrity: true });
  ok('import : accepté quand l\'utilisateur confirme (ignoreIntegrity)', (await getAll(STORES.TRANSACTIONS)).some((x) => x.amount === 1201.5));
  await importJsonBackup(fileOf({ stores: full.stores }), { merge: true });
  ok('import : ancienne sauvegarde sans empreinte acceptée comme avant', true);
}

// ---------- Cache de lecture du moteur de calcul : jamais de chiffre périmé ----------
{
  const { computeNetWorth } = await import('../js/ledger.js');
  const dbm = await import('../js/db.js');
  await wipeAllData();
  await dbm.setSetting('baseCurrency', 'XOF');
  await dbAdd(STORES.WALLETS, { id: 'w-c1', name: 'Caisse', type: 'cash', currency: 'XOF', initialBalance: 1000, archived: false, usage: 'current', createdAt: '2026-01-01T00:00:00.000Z' });
  const nw = async () => (await computeNetWorth()).total;
  const v0 = dbm.getDataVersion();
  eq('cache : patrimoine initial', await nw(), 1000);
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-c1', walletId: 'w-c1', type: 'expense', amount: 300, date: '2026-10-01', createdAt: '2026-10-01T00:00:00.000Z' });
  eq('cache : une écriture est vue tout de suite (pas de lecture périmée)', [await nw(), dbm.getDataVersion() > v0], [700, true]);
  await dbm.dbPut(STORES.TRANSACTIONS, { id: 'tx-c1', walletId: 'w-c1', type: 'expense', amount: 100, date: '2026-10-01', createdAt: '2026-10-01T00:00:00.000Z' });
  eq('cache : une modification aussi', await nw(), 900);
  await dbm.dbDelete(STORES.TRANSACTIONS, 'tx-c1');
  eq('cache : et une suppression', await nw(), 1000);
  // Lecture lancée pendant une écriture : le résultat suivant doit refléter l'écriture terminée
  const [, ] = await Promise.all([nw(), dbm.dbWriteBatch([{ store: STORES.TRANSACTIONS, type: 'add', value: { id: 'tx-c2', walletId: 'w-c1', type: 'income', amount: 50, date: '2026-10-02', createdAt: '2026-10-02T00:00:00.000Z' } }])]);
  eq('cache : après une lecture concurrente d\'une écriture groupée', await nw(), 1050);
  await dbm.importAllData({ stores: { [STORES.TRANSACTIONS]: [] } }, { merge: false });
  eq('cache : après un import qui remplace les données', await nw(), 1000);
  await dbm.setSetting('baseCurrency', 'EUR');
  eq('cache : un réglage modifié (devise de base) invalide aussi la lecture', (await computeNetWorth()).currency, 'EUR');
}

// ---------- Photos de la sauvegarde cloud : envoyées une seule fois, à part ----------
{
  const cp = await import('../js/cloud-photos.js');
  const bk = await import('../js/backup.js');
  const dbm = await import('../js/db.js');
  const memStore = () => {
    const s = { m: new Map(), writes: 0, failAfter: Infinity, deleted: [] };
    s.get = async (id) => (s.m.has(id) ? structuredClone(s.m.get(id)) : null);
    s.set = async (id, data) => { if (s.writes >= s.failAfter) throw new Error('réseau coupé'); s.writes++; s.m.set(id, structuredClone(data)); };
    s.deleteMany = async (ids) => ids.forEach((id) => { s.m.delete(id); s.deleted.push(id); });
    s.photoDocs = () => [...s.m.keys()].filter((k) => k.startsWith('p_'));
    return s;
  };
  const mkPhoto = (i, size = 40, type = 'image/jpeg') => new Blob([new Uint8Array(size).map((_, j) => (i * 31 + j) & 255)], { type });
  const asMap = async (list) => { const m = new Map(); for (const b of list) m.set(await bk.photoHash(b), b); return m; };
  const keep = async (b) => b; // pas de recompression dans ces tests : on vérifie le transport, pas le JPEG
  const bytesOf = async (b) => Array.from(new Uint8Array(await b.arrayBuffer())).join(',');

  // Chiffrement : aller-retour, type conservé, morceaux multiples, mauvaise clé
  const { key, manifest } = await cp.newPhotoManifest('secret');
  const png = mkPhoto(9, 500, 'image/png');
  const parts = await cp.encryptPhotoToParts(key, png, 120);
  const back = await cp.decryptPhotoFromParts(key, parts);
  eq('photos cloud : aller-retour chiffré (octets et type identiques), en plusieurs morceaux', [parts.length > 3, back.type, await bytesOf(back) === await bytesOf(png)], [true, 'image/png', true]);
  const plainB64 = btoa(String.fromCharCode(...new Uint8Array(await png.arrayBuffer())));
  eq('photos cloud : le contenu envoyé n\'est pas l\'image en clair, et chaque morceau respecte la taille limite', [parts.join('').includes(plainB64.slice(8, 48)), parts.every((p) => p.length <= 120)], [false, true]);
  const other = (await cp.newPhotoManifest('autre')).key;
  let wrongKey = 'accepté';
  try { await cp.decryptPhotoFromParts(other, parts); } catch { wrongKey = 'refusé'; }
  eq('photos cloud : une autre clé ne déchiffre pas', wrongKey, 'refusé');
  eq('photos cloud : l\'index s\'ouvre avec le bon mot de passe seulement', [!!(await cp.openPhotoManifest('secret', manifest)), await cp.openPhotoManifest('faux', manifest), await cp.openPhotoManifest('secret', null)], [true, null, null]);

  // Empreintes : stables, identiques pour une même photo, et 32 caractères hexadécimaux
  const p1 = mkPhoto(1), p2 = mkPhoto(2), p3 = mkPhoto(3);
  const h1 = await bk.photoHash(p1);
  eq('photos cloud : empreinte stable de 32 caractères hexadécimaux, propre au contenu', [/^[0-9a-f]{32}$/.test(h1), h1 === await bk.photoHash(mkPhoto(1)), h1 === await bk.photoHash(p2)], [true, true, false]);

  // Envoi incrémental
  const store = memStore();
  const first = await cp.uploadPhotos({ store, passphrase: 'secret', photos: await asMap([p1, p2]), prepare: keep });
  eq('photos cloud : premier envoi, 2 photos', [first.uploaded, store.photoDocs().length, (await store.get('photoIndex')).hashes.length], [2, 2, 2]);
  const writesAfterFirst = store.writes;
  const again = await cp.uploadPhotos({ store, passphrase: 'secret', photos: await asMap([p1, p2]), prepare: keep });
  eq('photos cloud : une seconde sauvegarde identique n\'envoie RIEN (aucune écriture)', [again.uploaded, store.writes - writesAfterFirst], [0, 0]);
  const third = await cp.uploadPhotos({ store, passphrase: 'secret', photos: await asMap([p1, p2, p3]), prepare: keep });
  eq('photos cloud : une nouvelle photo = un seul envoi, les autres ne repartent pas', [third.uploaded, store.photoDocs().length], [1, 3]);

  // Restauration
  const wanted = [...(await asMap([p1, p2, p3])).keys()];
  const dl = await cp.downloadPhotos({ store, passphrase: 'secret', hashes: wanted });
  eq('photos cloud : restauration complète, octets identiques', [dl.missing.length, await bytesOf(dl.blobs.get(await bk.photoHash(p2))) === await bytesOf(p2)], [0, true]);
  const wrongPass = await cp.downloadPhotos({ store, passphrase: 'faux', hashes: wanted });
  eq('photos cloud : mauvais mot de passe → toutes manquantes, aucune erreur', [wrongPass.blobs.size, wrongPass.missing.length], [0, 3]);
  store.m.delete(cp.photoDocId(wanted[0], 0));
  const h2doc = cp.photoDocId(wanted[1], 0); const broken = store.m.get(h2doc); store.m.set(h2doc, { ...broken, data: broken.data.slice(0, -8) + 'AAAAAAAA' });
  const partial = await cp.downloadPhotos({ store, passphrase: 'secret', hashes: [...wanted, 'f'.repeat(32)] });
  eq('photos cloud : photo absente, abîmée ou inconnue → comptée manquante, les autres reviennent', [partial.blobs.size, partial.missing.length], [1, 3]);

  // Plusieurs morceaux par photo, et suppression complète
  const big = memStore();
  await cp.uploadPhotos({ store: big, passphrase: 'secret', photos: await asMap([mkPhoto(5, 2000)]), prepare: keep, partChars: 500 });
  const nParts = big.photoDocs().length;
  const bigBack = await cp.downloadPhotos({ store: big, passphrase: 'secret', hashes: [await bk.photoHash(mkPhoto(5, 2000))] });
  eq('photos cloud : une grosse photo est découpée en morceaux et revient intacte', [nParts > 3, bigBack.missing.length, await bytesOf([...bigBack.blobs.values()][0]) === await bytesOf(mkPhoto(5, 2000))], [true, 0, true]);

  // Envoi interrompu : reprise sans renvoyer ce qui est parti
  const flaky = memStore();
  const six = []; for (let i = 20; i < 26; i++) six.push(mkPhoto(i));
  let calls = 0;
  const flakyPrepare = async (b) => { if (++calls === 4) throw new Error('photo illisible'); return b; }; // la 4e photo échoue : l'envoi s'arrête
  let interrupted = false;
  try { await cp.uploadPhotos({ store: flaky, passphrase: 'secret', photos: await asMap(six), prepare: flakyPrepare, concurrency: 1 }); } catch { interrupted = true; }
  const sentBefore = flaky.photoDocs().length;
  const resumed = await cp.uploadPhotos({ store: flaky, passphrase: 'secret', photos: await asMap(six), prepare: keep });
  eq('photos cloud : envoi interrompu puis repris — l\'index a gardé les 3 photos parties, seules les 3 restantes repartent', [interrupted, sentBefore, resumed.uploaded, flaky.photoDocs().length], [true, 3, 3, 6]);
  // Coupure réseau franche (l'index ne peut pas non plus être enregistré) : tout est reprenable, au pire quelques photos sont renvoyées
  const cut = memStore(); cut.failAfter = 4;
  let cutFailed = false;
  try { await cp.uploadPhotos({ store: cut, passphrase: 'secret', photos: await asMap(six), prepare: keep, concurrency: 1 }); } catch { cutFailed = true; }
  cut.failAfter = Infinity;
  const afterCut = await cp.uploadPhotos({ store: cut, passphrase: 'secret', photos: await asMap(six), prepare: keep });
  const cutBack = await cp.downloadPhotos({ store: cut, passphrase: 'secret', hashes: [...(await asMap(six)).keys()] });
  eq('photos cloud : coupure réseau en plein envoi — la reprise va au bout, toutes les photos sont lisibles', [cutFailed, afterCut.total, cutBack.missing.length], [true, 6, 0]);

  // Suppression des photos devenues inutiles (transaction supprimée), après la bascule
  const pruneN = await cp.pruneUnreferencedPhotos({ store, referenced: new Set([await bk.photoHash(p2)]) }); // (la copie de p1 a été retirée plus haut : l'index la liste encore)
  const idx = await store.get('photoIndex');
  eq('photos cloud : les photos plus référencées sont supprimées du cloud (toutes leurs parties) et de l\'index', [pruneN, store.photoDocs().length, idx.hashes.length], [2, 1, 1]);

  // Changement de mot de passe : tout repart sous la nouvelle clé, l'ancienne copie est supprimée
  const st2 = memStore();
  await cp.uploadPhotos({ store: st2, passphrase: 'ancien', photos: await asMap([p1, p2]), prepare: keep });
  const oldIds = st2.photoDocs();
  const reset = await cp.uploadPhotos({ store: st2, passphrase: 'nouveau', photos: await asMap([p1, p2]), prepare: keep });
  const nowOk = await cp.downloadPhotos({ store: st2, passphrase: 'nouveau', hashes: [...(await asMap([p1, p2])).keys()] });
  const oldFails = await cp.downloadPhotos({ store: st2, passphrase: 'ancien', hashes: [...(await asMap([p1])).keys()] });
  eq('photos cloud : mot de passe changé — les photos repartent sous la nouvelle clé, l\'ancien mot de passe ne marche plus', [reset.reset, reset.uploaded, nowOk.missing.length, oldFails.missing.length, oldIds.length], [true, 2, 0, 1, 2]);

  // Intégration à la sauvegarde : données SANS photo, empreintes sur les transactions
  await wipeAllData();
  await dbAdd(STORES.WALLETS, { id: 'w-cp', name: 'Caisse', type: 'cash', currency: 'XOF', initialBalance: 0, archived: false, usage: 'current', createdAt: '2026-01-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-cp1', walletId: 'w-cp', type: 'expense', amount: 1, date: '2026-10-01', receiptBlob: p1, createdAt: '2026-10-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-cp2', walletId: 'w-cp', type: 'expense', amount: 2, date: '2026-10-02', receiptBlob: p1, createdAt: '2026-10-02T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-cp3', walletId: 'w-cp', type: 'expense', amount: 3, date: '2026-10-03', createdAt: '2026-10-03T00:00:00.000Z' });
  const collected = new Map();
  const payload = await bk.buildEncryptedPayload('mdp', { collectPhotos: collected });
  const clear = await bk.decryptPayload(payload, 'mdp');
  const rows = Object.fromEntries(clear.stores.transactions.map((t) => [t.id, t]));
  eq('sauvegarde cloud : les données ne contiennent aucune photo, seulement l\'empreinte', [clear.photosExternal, rows['tx-cp1'].receiptHash === h1, rows['tx-cp1'].receiptDataUrl, rows['tx-cp1'].receiptBlob, rows['tx-cp3'].receiptHash], [true, true, undefined, undefined, undefined]);
  eq('sauvegarde cloud : deux transactions avec la même photo = une seule photo à envoyer', collected.size, 1);
  const filePayload = await bk.decryptPayload(await bk.buildEncryptedPayload('mdp'), 'mdp');
  eq('sauvegarde en fichier : les photos restent DANS le fichier (autonome), pas d\'empreinte', [filePayload.photosExternal, typeof filePayload.stores.transactions.find((t) => t.id === 'tx-cp1').receiptDataUrl], [undefined, 'string']);
  void dbm;
  await wipeAllData();
}

// ---------- Sauvegarde : photos allégées dans la copie, jamais dans la base ----------
{
  const bk = await import('../js/backup.js');
  const dbm = await import('../js/db.js');
  // Image « photographique » : dégradé + bruit (se compresse comme une vraie photo, pas comme un aplat)
  const makePhoto = (w, h, q) => new Promise((resolve) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const img = g.createImageData(w, h); let s = 7;
    for (let i = 0; i < img.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const n = (s >> 16) & 63; const x = (i / 4) % w, y = Math.floor(i / 4 / w);
      img.data[i] = (x * 255 / w + n) & 255; img.data[i + 1] = (y * 255 / h + n) & 255; img.data[i + 2] = ((x + y) * 127 / (w + h) + n) & 255; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0); c.toBlob(resolve, 'image/jpeg', q);
  });
  const dims = async (dataUrl) => { const im = new Image(); im.src = dataUrl; await im.decode(); return Math.max(im.naturalWidth, im.naturalHeight); };
  const big = await makePhoto(2000, 1500, 0.92);
  const mid = await makePhoto(900, 700, 0.85);
  await wipeAllData();
  await dbAdd(STORES.WALLETS, { id: 'w-p1', name: 'Caisse', type: 'cash', currency: 'XOF', initialBalance: 0, archived: false, usage: 'current', createdAt: '2026-01-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-big', walletId: 'w-p1', type: 'expense', amount: 1, date: '2026-10-01', receiptBlob: big, createdAt: '2026-10-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-mid', walletId: 'w-p1', type: 'expense', amount: 2, date: '2026-10-02', receiptBlob: mid, createdAt: '2026-10-02T00:00:00.000Z' });
  const exportPhotos = async () => {
    const clear = await bk.decryptPayload(await bk.buildEncryptedPayload('x'), 'x');
    const rows = Object.fromEntries(clear.stores.transactions.map((t) => [t.id, t.receiptDataUrl]));
    return { big: rows['tx-big'], mid: rows['tx-mid'] };
  };
  eq('photos de sauvegarde : allégées par défaut', await bk.isLightBackupPhotos(), true);
  const light = await exportPhotos();
  await dbm.setSetting('backupLightPhotos', false);
  eq('photos de sauvegarde : le réglage peut être désactivé', await bk.isLightBackupPhotos(), false);
  const normal = await exportPhotos();
  ok('photos de sauvegarde : la copie allégée est nettement plus petite (grande photo)', light.big.length < normal.big.length * 0.8, `${light.big.length} vs ${normal.big.length}`);
  ok('photos de sauvegarde : une photo moyenne (sous 250 Ko après réduction) est aussi allégée, pas en mode standard', light.mid.length < normal.mid.length * 0.9, `${light.mid.length} vs ${normal.mid.length}`);
  eq('photos de sauvegarde : 1 200 px au plus en allégé, 1 600 px au plus en standard', [await dims(light.big), await dims(normal.big)], [1200, 1600]);
  const stored = (await dbGetAll(STORES.TRANSACTIONS)).find((t) => t.id === 'tx-big');
  eq('photos de sauvegarde : la photo gardée sur l\'appareil n\'est pas modifiée', [stored.receiptBlob.size, stored.receiptBlob.size === big.size], [big.size, true]);
  const est = await bk.estimateBackupSize();
  await dbm.setSetting('backupLightPhotos', true);
  const estLight = await bk.estimateBackupSize();
  ok('photos de sauvegarde : l\'estimation de taille suit le réglage', estLight.light === true && est.light === false && estLight.estimatedBytes < est.estimatedBytes, `${estLight.estimatedBytes} vs ${est.estimatedBytes}`);
  await wipeAllData();
}

{

  eq('accès : un code faux compte une tentative et entre dans le journal', [await get('failedAttempts'), (await get('pinFailureLog')).length], [1, 1]);
  eq('accès : le bon code remet le compteur à zéro', [await auth.verifyAccessCode('123456'), await get('failedAttempts')], ['owner', 0]);

  let err1 = null; try { await auth.setupHelperPin('654321', '000000'); } catch (e) { err1 = e.message; }
  ok('code aidant : refusé si le code du propriétaire est faux', !!err1);
  let err2 = null; try { await auth.setupHelperPin('1234', '123456'); } catch (e) { err2 = e.message; }
  ok('code aidant : refusé s\'il n\'a pas le même nombre de chiffres', !!err2 && err2.includes('6'), err2);
  let err3 = null; try { await auth.setupHelperPin('123456', '123456'); } catch (e) { err3 = e.message; }
  ok('code aidant : refusé s\'il est identique à celui du propriétaire', !!err3, err3);
  await auth.setupHelperPin('654321', '123456');
  eq('code aidant : défini', await auth.isHelperConfigured(), true);
  eq('accès : le code aidant ouvre en « aidant », celui du propriétaire en « propriétaire »', [await auth.verifyAccessCode('654321'), await auth.verifyAccessCode('123456')], ['helper', 'owner']);
  ok('code aidant : jamais en clair en base (sel + hachage seulement)', !JSON.stringify(await dbGetAll(STORES.SETTINGS)).includes('654321'));
  const afterChange = await auth.changePin('123456', '1234');
  eq('changer le code propriétaire à 4 chiffres retire le code aidant de 6 chiffres', [afterChange.helperRemoved, await auth.isHelperConfigured()], [true, false]);
  await auth.changePin('1234', '123456');
  await auth.setupHelperPin('654321', '123456');
  await auth.removeHelperPin();
  eq('code aidant : retiré', await auth.isHelperConfigured(), false);

  // Journal des codes ratés
  await setSetting('lastUnlockAt', 1000);
  await setSetting('pinFailureLog', [500, 1500, 2500]);
  eq('rapport de visite : 2 codes ratés depuis la dernière visite, le dernier à 2500', await auth.consumeUnlockReport(3000), { since: 1000, failures: 2, lastFailureAt: 2500 });
  eq('rapport de visite : une fois consulté, plus rien à signaler', (await auth.consumeUnlockReport(4000)).failures, 0);
  await setSetting('lastUnlockAt', 0);
  eq('rapport de visite : première visite, rien à comparer', await auth.consumeUnlockReport(5000), { since: 0, failures: 0, lastFailureAt: null });
  await setSetting('pinFailureLog', Array.from({ length: 40 }, (_, i) => i + 6000));
  await auth.verifyAccessCode('999999');
  eq('journal : limité aux 30 derniers codes ratés', (await get('pinFailureLog')).length, 30);
  // Coquille du propriétaire juste avant sa réussite : pas une intrusion. Un vrai échec ancien (> 1 min) reste compté.
  await setSetting('lastUnlockAt', Date.now() - 300000);
  await setSetting('pinFailureLog', [Date.now() - 120000]);
  await auth.verifyAccessCode('999999');
  await auth.verifyAccessCode('123456');
  eq('rapport de visite : la faute de frappe suivie du bon code n\'est pas comptée, l\'échec ancien oui', (await auth.consumeUnlockReport(Date.now() + 1)).failures, 1);

  // Garde d'accès « aidant » (db.js)
  await wipeAllData();
  await dbAdd(STORES.WALLETS, { id: 'w-h1', name: 'Caisse', currency: 'XOF', initialBalance: 0, createdAt: '2026-01-01T00:00:00.000Z' });
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-owner', walletId: 'w-h1', type: 'income', amount: 100, date: '2026-10-01', createdAt: '2026-10-01T00:00:00.000Z' });
  const rejects = async (fn) => { try { await fn(); return false; } catch (e) { return e.name === 'HelperRestrictedError'; } };
  dbm.setAccessRole('helper');
  await dbAdd(STORES.TRANSACTIONS, { id: 'tx-helper', walletId: 'w-h1', type: 'expense', amount: 40, date: '2026-10-02', createdAt: '2026-10-02T00:00:00.000Z' });
  await dbm.logAudit({ entityType: 'transaction', entityId: 'tx-helper', action: 'create' });
  eq('aidant : ce qu\'il saisit est marqué', (await getAll(STORES.TRANSACTIONS)).find((x) => x.id === 'tx-helper').enteredBy, 'helper');
  eq('aidant : le journal d\'audit note qui a agi', (await getAll(STORES.AUDIT_LOG)).some((x) => x.actor === 'helper'), true);
  eq('aidant : ne peut pas supprimer une opération du propriétaire', await rejects(() => dbDelete(STORES.TRANSACTIONS, 'tx-owner')), true);
  eq('aidant : ne peut pas supprimer un portefeuille', await rejects(() => dbDelete(STORES.WALLETS, 'w-h1')), true);
  eq('aidant : ne peut rien vider, tout effacer, ni supprimer en lot', [await rejects(() => dbm.dbClear(STORES.TRANSACTIONS)), await rejects(() => wipeAllData()), await rejects(() => dbm.dbWriteBatch([{ store: STORES.TRANSACTIONS, type: 'delete', value: 'tx-owner' }]))], [true, true, true]);
  eq('aidant : ne peut pas importer ou restaurer', await rejects(() => dbm.importAllData({ stores: { [STORES.WALLETS]: [] } })), true);
  ok('aidant : peut en revanche vérifier une sauvegarde (validation à blanc, rien n\'est écrit)', !!(await dbm.importAllData({ stores: { [STORES.WALLETS]: [] } }, { dryRun: true })));
  await dbm.dbWriteBatch([{ store: STORES.TRANSACTIONS, type: 'add', value: { id: 'tx-helper-b', walletId: 'w-h1', type: 'expense', amount: 5, date: '2026-10-03' } }]);
  eq('aidant : une écriture groupée est marquée aussi', (await getAll(STORES.TRANSACTIONS)).find((x) => x.id === 'tx-helper-b').enteredBy, 'helper');
  // Écrasement (dbPut / lots « put ») : créer oui, réécrire l'existant du propriétaire non
  await dbm.dbPut(STORES.TRANSACTIONS, { id: 'tx-helper-c', walletId: 'w-h1', type: 'expense', amount: 9, date: '2026-10-04', createdAt: '2026-10-04T00:00:00.000Z' });
  eq('aidant : une transaction créée par dbPut (formulaire de saisie express) est marquée aussi', (await getAll(STORES.TRANSACTIONS)).find((x) => x.id === 'tx-helper-c').enteredBy, 'helper');
  await dbm.dbPut(STORES.TRANSACTIONS, { id: 'tx-helper-c', walletId: 'w-h1', type: 'expense', amount: 12, date: '2026-10-04', createdAt: '2026-10-04T00:00:00.000Z' });
  eq('aidant : peut corriger sa propre saisie, la marque est conservée', (await getAll(STORES.TRANSACTIONS)).filter((x) => x.id === 'tx-helper-c').map((x) => [x.amount, x.enteredBy]), [[12, 'helper']]);
  eq('aidant : ne peut pas réécrire une opération du propriétaire (montant, rapprochement…)', await rejects(() => dbm.dbPut(STORES.TRANSACTIONS, { id: 'tx-owner', walletId: 'w-h1', type: 'income', amount: 1, date: '2026-10-01' })), true);
  eq('aidant : ne peut pas réécrire un portefeuille existant (solde initial, archivage)', await rejects(() => dbm.dbPut(STORES.WALLETS, { id: 'w-h1', name: 'Caisse', currency: 'XOF', initialBalance: 999 })), true);
  dbm.setAccessRole('owner');
  await dbAdd(STORES.DEBTS, { id: 'd-own', personName: 'Koffi', type: 'receivable', principal: 800, currency: 'XOF', startDate: '2026-10-01' });
  dbm.setAccessRole('helper');
  eq('aidant : « annuler une dette » (réécriture d\'une dette existante) est refusé', await rejects(() => dbm.dbPut(STORES.DEBTS, { id: 'd-own', personName: 'Koffi', type: 'receivable', principal: 0, currency: 'XOF', startDate: '2026-10-01' })), true);
  eq('aidant : un lot qui réécrit un enregistrement existant est refusé en entier (rien d\'écrit)', [await rejects(() => dbm.dbWriteBatch([
    { store: STORES.TRANSACTIONS, type: 'add', value: { id: 'tx-never', walletId: 'w-h1', type: 'expense', amount: 1, date: '2026-10-05' } },
    { store: STORES.DEBTS, type: 'put', value: { id: 'd-own', personName: 'Koffi', type: 'receivable', principal: 0, currency: 'XOF', startDate: '2026-10-01' } },
  ])), (await getAll(STORES.TRANSACTIONS)).some((x) => x.id === 'tx-never')], [true, false]);
  eq('aidant : peut créer une nouvelle dette', !!(await dbAdd(STORES.DEBTS, { id: 'd-new', personName: 'Ali', type: 'debt', principal: 100, currency: 'XOF', startDate: '2026-10-05' })), true);
  // Dernier remboursement : la dette passe « soldée » (seule réécriture de dette permise), tout autre changement reste refusé
  const settleDebt = { id: 'd-settle', personName: 'Awa', type: 'receivable', principal: 500, currency: 'XOF', startDate: '2026-10-05', status: 'active' };
  await dbAdd(STORES.DEBTS, { ...settleDebt });
  eq('aidant : solder une dette par un remboursement (active → soldée, rien d\'autre ne change) est permis, même en lot', await dbm.dbWriteBatch([
    { store: STORES.DEBT_PAYMENTS, type: 'add', value: { id: 'p-settle', debtId: 'd-settle', amount: 500, date: '2026-10-06' } },
    { store: STORES.DEBTS, type: 'put', value: { ...settleDebt, status: 'paid' } },
  ]).then(() => (async () => (await getAll(STORES.DEBTS)).find((x) => x.id === 'd-settle').status)()), 'paid');
  eq('aidant : une dette soldée ne peut plus être rouverte', await rejects(() => dbm.dbPut(STORES.DEBTS, { ...settleDebt, status: 'active' })), true);
  await dbAdd(STORES.DEBTS, { ...settleDebt, id: 'd-settle2' });
  eq('aidant : « soldée » accompagné d\'un autre changement (montant effacé) reste refusé', await rejects(() => dbm.dbPut(STORES.DEBTS, { ...settleDebt, id: 'd-settle2', status: 'paid', principal: 0 })), true);
  eq('aidant : annuler une dette (status « cancelled ») reste refusé', await rejects(() => dbm.dbPut(STORES.DEBTS, { ...settleDebt, id: 'd-settle2', status: 'cancelled' })), true);
  eq('aidant : les projets collectifs (réglage du propriétaire) sont protégés, un réglage ordinaire non', [await rejects(() => setSetting('groupProjects', [])), await setSetting('privacyHidden', true).then(() => true)], [true, true]);
  eq('aidant : pas d\'écrasement en masse (import CSV, données de démonstration)', await rejects(() => dbm.dbBulkPut(STORES.WALLETS, [{ id: 'w-x', name: 'X', currency: 'XOF' }])), true);
  await dbDelete(STORES.TRANSACTIONS, 'tx-helper');
  eq('aidant : peut annuler ce qu\'il vient de saisir', (await getAll(STORES.TRANSACTIONS)).some((x) => x.id === 'tx-helper'), false);
  // Confirmation de suppression : refus immédiat (pas de demande de code PIN), avec un message
  const toastBox2 = Object.assign(document.createElement('div'), { id: 'toast-container' });
  document.body.append(toastBox2);
  appState.role = 'helper';
  eq('aidant : une confirmation de suppression est refusée tout de suite', await confirmDialog('Supprimer ?', { requirePin: true }), false);
  ok('aidant : message « réservé au propriétaire »', toastBox2.textContent.includes('réservée au propriétaire'));
  appState.role = 'owner';
  toastBox2.remove();
  dbm.setAccessRole('owner');
  await dbDelete(STORES.TRANSACTIONS, 'tx-owner');
  eq('propriétaire : peut supprimer', (await getAll(STORES.TRANSACTIONS)).some((x) => x.id === 'tx-owner'), false);
  await wipeAllData();
}

// ---------- Lot 4 : file d'attente des SMS Mobile Money ----------
{
  const q = await import('../js/sms-queue.js');
  const { openSmsImportModal } = await import('../js/modules/sms-import.js');
  const SMS_A = 'Vous avez reçu 10 000 FCFA de Awa Ndiaye. Nouveau solde: 30 000 FCFA. Ref: 8839201';
  const SMS_B = 'Vous avez envoyé 5 000F à Moussa Diop (+221771234567). Frais: 100F. Nouveau solde: 12 400F. ID: TX8841923';
  const t0 = 1700000000000;
  await wipeAllData();
  const first = await q.queueSharedSms(SMS_A, t0);
  const again = await q.queueSharedSms(`  ${SMS_A}  \r\n`, t0 + 1000);
  eq('file : un même SMS partagé deux fois n\'est gardé qu\'une fois', [again.id === first.id, (await q.getSmsInbox(t0 + 2000)).length], [true, 1]);
  eq('file : texte vide ignoré', [await q.queueSharedSms('   ', t0), await q.queueSharedSms(null, t0)], [null, null]);
  await q.queueSharedSms(SMS_B, t0 + 3000);
  const listed = await q.getSmsInbox(t0 + 4000);
  eq('file : deux SMS en attente, du plus ancien au plus récent', listed.map((e) => e.text.slice(0, 14)), ['Vous avez reçu', 'Vous avez envo']);
  eq('file : le texte d\'import les sépare par une ligne vide, et l\'analyseur en retrouve deux', parseMobileMoneyMessages(q.smsInboxText(listed)).messages.map((m) => m.amount), [10000, 5000]);
  eq('file : la validation ne retire que les SMS présents dans le texte validé', [await q.removeImportedFromInbox(`autre texte ${SMS_A} fin`, t0 + 5000), (await q.getSmsInbox(t0 + 5000)).map((e) => e.text === SMS_B)], [1, [true]]);
  eq('file : un SMS vieux de plus de 30 jours disparaît', (await q.getSmsInbox(t0 + 3000 + 31 * 864e5)).length, 0);
  for (let i = 0; i < 60; i++) await q.queueSharedSms(`SMS numéro ${i} de 100 FCFA`, t0 + 10000 + i);
  const capped = await q.getSmsInbox(t0 + 20000);
  eq('file : 50 SMS au plus, les plus récents gardés', [capped.length, capped[capped.length - 1].text], [50, 'SMS numéro 59 de 100 FCFA']);
  await q.clearSmsInbox();
  eq('file : vidée', (await q.getSmsInbox(t0 + 20000)).length, 0);

  // Formats plausibles mais INVENTÉS (aucun corpus d'opérateur) : vérifient la robustesse de l'analyse, pas la couverture réelle.
  const w = sms('Vous avez reçu 10.000F de Awa Koné. Votre solde Wave est de 25.000F.', { today });
  eq('SMS inventé (style Wave) : reçu 10.000F', [w.direction, w.amount, w.balance], ['in', 10000, 25000]);
  const o = sms('Vous avez envoye 2500 FCFA a 0707070707. Frais: 0 FCFA. Nouveau solde: 7500 FCFA.', { today });
  eq('SMS inventé (style Orange) : envoi 2500, solde 7500', [o.direction, o.amount, o.balance], ['out', 2500, 7500]);
  const m = sms('Depot de 20000 FCFA effectue avec succes. Solde: 35000 FCFA', { today });
  eq('SMS inventé (style MTN) : dépôt 20000', [m.kind, m.direction, m.amount], ['deposit', 'in', 20000]);

  // Parcours réel : fenêtre d'import préremplie par la file, puis validation
  await wipeAllData();
  await dbAdd(STORES.WALLETS, { id: 'w-q1', name: 'Orange Money', type: 'mobile_money', currency: 'XOF', initialBalance: 50000, archived: false, usage: 'current', createdAt: '2026-01-01T00:00:00.000Z' });
  await q.queueSharedSms(SMS_A, Date.now());
  await q.queueSharedSms(SMS_B, Date.now());
  const modalRoot3 = Object.assign(document.createElement('div'), { id: 'modal-root' });
  const toastBox3 = Object.assign(document.createElement('div'), { id: 'toast-container' });
  document.body.append(modalRoot3, toastBox3);
  await openSmsImportModal();
  ok('fenêtre d\'import : préremplie avec les SMS en attente', modalRoot3.querySelector('#sms-text').value.includes('Awa Ndiaye') && modalRoot3.querySelector('#sms-text').value.includes('Moussa Diop'));
  ok('fenêtre d\'import : annonce 2 SMS en attente, avec « Ignorer »', modalRoot3.textContent.includes('2 SMS en attente') && !!modalRoot3.querySelector('#sms-ignore-btn'));
  eq('fenêtre d\'import : deux opérations proposées', modalRoot3.querySelectorAll('[data-sms-index]').length, 2);
  modalRoot3.querySelector('#sms-import-btn').click();
  await new Promise((r) => setTimeout(r, 600));
  eq('import validé : les deux transactions existent', (await dbGetAll(STORES.TRANSACTIONS)).map((x) => x.amount).sort((a, b) => a - b), [100, 5000, 10000]);
  eq('import validé : la file d\'attente est vidée', (await q.getSmsInbox()).length, 0);
  await q.queueSharedSms('Vous avez reçu 3 000 FCFA de Koffi. Nouveau solde: 40 000 FCFA. Ref: 7000001');
  await openSmsImportModal();
  modalRoot3.querySelector('#sms-ignore-btn').click();
  await new Promise((r) => setTimeout(r, 200));
  eq('« Ignorer » : file vidée, aucune transaction ajoutée', [(await q.getSmsInbox()).length, (await dbGetAll(STORES.TRANSACTIONS)).length], [0, 3]);
  await q.queueSharedSms('Vous avez reçu 4 000 FCFA de Ibrahim. Ref: 7000002');
  await openSmsImportModal();
  modalRoot3.querySelectorAll('.modal-close').forEach((b) => b.click());
  eq('fermer sans importer : le SMS reste en attente', (await q.getSmsInbox()).length, 1);
  await q.clearSmsInbox();
  // Import partiel : le SMS décoché ne doit PAS quitter la file
  await q.queueSharedSms('Vous avez reçu 2 000 FCFA de Zoé. Ref: 9000001');
  await q.queueSharedSms('Vous avez reçu 3 000 FCFA de Yao. Ref: 9000002');
  await openSmsImportModal();
  const firstCheck = modalRoot3.querySelector('[data-sms-check]');
  firstCheck.checked = false;
  firstCheck.dispatchEvent(new Event('change', { bubbles: true }));
  modalRoot3.querySelector('#sms-import-btn').click();
  await new Promise((r) => setTimeout(r, 600));
  eq('import partiel : le SMS décoché reste en attente, l\'autre est parti', (await q.getSmsInbox()).map((e) => e.text.includes('Zoé')), [true]);
  ok('import partiel : seule la transaction cochée est créée', (await dbGetAll(STORES.TRANSACTIONS)).some((x) => x.amount === 3000) && !(await dbGetAll(STORES.TRANSACTIONS)).some((x) => x.amount === 2000));
  modalRoot3.remove(); toastBox3.remove();
  await wipeAllData();
}

// ---------- Rendu ----------
const ul = document.getElementById('results');
const pass = results.filter((r) => r.ok).length;
for (const r of results) {
  const li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = `${r.ok ? '✓' : '✗'} ${r.desc}` + (r.ok ? '' : ` — attendu ${JSON.stringify(r.expected)}, obtenu ${JSON.stringify(r.actual)}`);
  ul.appendChild(li);
}
const all = pass === results.length;
document.getElementById('summary').className = all ? 'pass' : 'fail';
document.getElementById('summary').textContent = `${pass} / ${results.length} tests réussis`;
document.title = `${all ? '✓' : '✗'} ${pass}/${results.length} — Djignan features tests`;
</script>
